<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Propagation Simulator — RIPPLE GUARD</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-navbar">
    
      
      
      <a href="index.html" class="nav-brand" style="display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 0;">
        <svg viewBox="0 0 240 46" height="38" xmlns="http://www.w3.org/2000/svg" style="overflow: visible;">
          <g transform="translate(12, 23) scale(0.8)">
            <!-- Black spider web icon -->
            <circle cx="0" cy="0" r="16" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="2 3"/>
            <circle cx="0" cy="0" r="10" fill="none" stroke="#111111" stroke-width="1.2"/>
            <circle cx="0" cy="0" r="4" fill="none" stroke="#222222" stroke-width="1.2"/>
            <path d="M-16,0 L16,0 M0,-16 L0,16 M-11.3,-11.3 L11.3,11.3 M-11.3,11.3 L11.3,-11.3" stroke="#000000" stroke-width="1.8"/>
            <!-- Center spider dot -->
            <circle cx="0" cy="0" r="2" fill="#000000"/>
          </g>
          <text x="40" y="32" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5" fill="#000000">
            WebNode
          </text>
        </svg>



      </div>
      <div class="brand-text-group">
        <span class="brand-name">RIPPLE GUARD</span>
        <span class="brand-subtitle">Dependency Risk Analysis</span>
      </div>
    </a>
    <nav class="nav-links">
      <a class="nav-item" href="index.html">← Unified Console</a>
      <a class="nav-item" href="graph.html">Dependency Graph</a>
      <a class="nav-item" href="scoreboard.html">Scoreboard</a>
      <a class="nav-item" href="propagation.html" style="color:var(--web-cyan);border-color:rgba(59, 130, 246,0.3);">Simulator</a>
    </nav>
  </header>

  <main class="analysis-container" style="padding-top: 24px;">
    <section class="analysis-section">
      <div class="section-header-row">
        <div class="section-title-group">
          <span class="section-num">STANDALONE VIEW</span>
          <h2 class="section-title">Taint Analysis Engine</h2>
          <p class="section-desc">Pick a package and observe how a compromise spreads hop by hop through the network.</p>
        </div>
      </div>

      <div class="simulator-controls-bar">
        <div class="control-input-group">
          <label for="node-select" class="control-label">Target Package:</label>
          <select id="node-select"><option value="">Choose a package…</option></select>
        </div>
      </div>

      <div class="graph-workspace">
        <div class="graph-view-card glass-panel">
          <svg id="graph" viewBox="0 0 900 550"></svg>
        </div>
        <aside id="info-panel" class="details-side-card">
          <p id="placeholder-text" class="info-placeholder">Pick a package above to simulate a compromise.</p>
        </aside>
      </div>
    </section>
  </main>

  <script src="water.js"></script>
  <script src="data.js"></script>
  <script src="shared.js"></script>
  <script src="propagation.js"></script>
</body>
</html>
