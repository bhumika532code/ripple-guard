<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vulnerability Scoreboard — RIPPLE GUARD</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-navbar">
    <a href="index.html" class="nav-brand">
      <div class="brand-icon-drop">
        <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
      </div>
      <div class="brand-text-group">
        <span class="brand-name">RIPPLE GUARD</span>
        <span class="brand-subtitle">Dependency Risk Analysis</span>
      </div>
    </a>
    <nav class="nav-links">
      <a class="nav-item" href="index.html">← Unified Console</a>
      <a class="nav-item" href="graph.html">Dependency Graph</a>
      <a class="nav-item" href="scoreboard.html" style="color:var(--water-cyan);border-color:rgba(56,189,248,0.3);">Scoreboard</a>
      <a class="nav-item" href="propagation.html">Simulator</a>
    </nav>
  </header>

  <main class="analysis-container" style="padding-top: 24px;">
    <section class="analysis-section">
      <div class="section-header-row">
        <div class="section-title-group">
          <span class="section-num">STANDALONE VIEW</span>
          <h2 class="section-title">Vulnerability Scoreboard</h2>
          <p class="section-desc">Every package ranked by true cascading risk, not just reported CVSS base scores.</p>
        </div>
      </div>

      <div class="glass-panel">
        <div class="scoreboard-scroll-wrapper">
          <table class="water-table">
            <thead>
              <tr>
                <th></th><th>Package</th><th>Vuln Score</th><th>True Risk</th>
                <th>Direct Deps</th><th>Apps Affected</th><th>Action</th><th></th>
              </tr>
            </thead>
            <tbody id="scoreboard-body"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="water.js"></script>
  <script src="data.js"></script>
  <script src="shared.js"></script>
  <script src="scoreboard.js"></script>
</body>
</html>
